apiVersion: v1
kind: ConfigMap
metadata:
  name: products-service-config
  namespace: kiran-nagp-ns
  labels:
    app: postgres
data:
  POSTGRES_DB: postgres
  PGDATA: /var/lib/postgresql/data/pgdata
  products-service-config.db-url: jdbc:postgresql://postgres-0.postgres-db-headless:5432/postgres
---
apiVersion: v1
kind: Secret
metadata:
  name: products-service-secret-config
  namespace: kiran-nagp-ns
  labels:
    app: postgres
data:
  POSTGRES_USER: cG9zdGdyZXM=
  POSTGRES_PASSWORD: UEBzc3cwcmQ=
  products-service-secret-config.db-username: cG9zdGdyZXM=
  products-service-secret-config.db-password: UEBzc3cwcmQ=
